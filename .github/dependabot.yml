# Dependency pinning is a release precondition - Dependabot is what keeps pinned
# versions from silently rotting into a stale, un-patchable pin.
#
# The claude-skill overlay ships no pip fragment by default (TEMPLATE-README.md step 3a), but
# this repo carries dev-only Python dependencies (requirements-dev.txt, requirements-dev-
# optional.txt - never imported by shipped code), so a pip entry is added by hand here,
# following the same pattern the node/go overlays use for their own ecosystems.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
