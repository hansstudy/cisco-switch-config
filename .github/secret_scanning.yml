# GitHub secret scanning custom path exclusions (release gate G02), same set as .gitleaks.toml.
#
# tests/fixtures/** carries the canary-secret corpus the masking test suite (AC15) needs;
# evals/** carries the same canary vocabulary embedded in eval prompt.md files. Both are
# obviously-synthetic by construction, never real credentials, and are
# excluded here so the first push raises no alert and nobody "fixes" the tests by weakening them.
paths-ignore:
  - "tests/fixtures/**"
  - "evals/**"
