! cisco-switch-config hardened baseline for ACC-SW-12
! generated by gen_baseline.py (skill 1.0.0) from spec sha256 2a8e0af571602e43895ead68d92272b8d5b0578d42732cbaa94da4ea5e4fb452
! platform iosxe, role access
! Fill every REPLACE-ME placeholder on the device before this configuration is used.
!
hostname ACC-SW-12
ip domain-name example.invalid
!
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
no service tcp-small-servers
no service udp-small-servers
no service config
no service call-home
no ip finger
no ip bootp server
no ip source-route
no ip domain-lookup
no ip http server
no ip http secure-server
no vstack
!
enable algorithm-type scrypt secret <REPLACE-ME:enable-secret>
username admin privilege 15 algorithm-type scrypt secret <REPLACE-ME:local-admin-secret>
!
aaa new-model
tacacs server TACACS-1
 address ipv4 198.51.100.10
 key <REPLACE-ME:tacacs-key>
 timeout 5
tacacs server TACACS-2
 address ipv4 198.51.100.11
 key <REPLACE-ME:tacacs-key>
 timeout 5
aaa group server tacacs+ TACACS-GRP
 server name TACACS-1
 server name TACACS-2
 ip tacacs source-interface Vlan30
aaa authentication login default group TACACS-GRP local
aaa authentication enable default group TACACS-GRP enable
aaa authorization console
aaa authorization exec default group TACACS-GRP local if-authenticated
aaa accounting exec default start-stop group TACACS-GRP
aaa accounting commands 15 default start-stop group TACACS-GRP
!
login block-for 120 attempts 3 within 60
login on-failure log
login on-success log
banner motd ^C
Authorized use only. All activity is monitored and recorded.
^C
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login authentication default
line aux 0
 no exec
 transport input none
 transport output none
line vty 0 15
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 login authentication default
 transport input ssh
 transport output ssh
!
crypto key generate rsa modulus 4096
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh dh min size 4096
ip ssh source-interface Vlan30
ip ssh server algorithm encryption aes256-gcm aes256-ctr
ip ssh server algorithm mac hmac-sha2-512 hmac-sha2-256
ip ssh server algorithm kex ecdh-sha2-nistp384 ecdh-sha2-nistp256
!
snmp-server group RO-GROUP v3 priv access MGMT-ACCESS
snmp-server user monuser RO-GROUP v3 auth sha <REPLACE-ME:snmpv3-auth> priv aes 256 <REPLACE-ME:snmpv3-priv>
snmp-server enable traps snmp authentication linkdown linkup coldstart warmstart
snmp-server enable traps config
snmp ifmib ifindex persist
!
ntp authenticate
ntp authentication-key 1 hmac-sha2-256 <REPLACE-ME:ntp-key-1>
ntp trusted-key 1
ntp source Vlan30
ntp server 198.51.100.123 key 1
ntp server 198.51.100.124 key 1
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
logging buffered 64000 informational
logging console critical
logging trap informational
logging source-interface Vlan30
logging host 198.51.100.30
logging host 198.51.100.31
!
archive
 log config
  logging enable
  logging size 500
  notify syslog contenttype plaintext
  hidekeys
 path flash:archive
 write-memory
!
vtp mode transparent
vlan 10
 name DATA-A
vlan 11
 name DATA-B
vlan 20
 name VOICE
vlan 30
 name MGMT
vlan 999
 name PARKING
vlan 998
 name NATIVE-UNUSED
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree portfast edge bpduguard default
spanning-tree loopguard default
udld enable
!
ip dhcp snooping vlan 10,11,20
no ip dhcp snooping information option
ip dhcp snooping database flash:dhcp-snooping.db
ip dhcp snooping
ip arp inspection vlan 10,11,20
ip arp inspection validate src-mac dst-mac ip
errdisable recovery cause bpduguard
errdisable recovery cause psecure-violation
errdisable recovery cause dhcp-rate-limit
errdisable recovery cause arp-inspection
errdisable recovery cause udld
errdisable recovery cause storm-control
errdisable recovery interval 300
!
interface TenGigabitEthernet1/1/1
 description uplink to DIST-01
 switchport trunk native vlan 998
 switchport trunk allowed vlan 10,11,20,30
 switchport mode trunk
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 udld port aggressive
interface TenGigabitEthernet1/1/2
 description uplink to DIST-02 (redundant)
 switchport trunk native vlan 998
 switchport trunk allowed vlan 10,11,20,30
 switchport mode trunk
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 udld port aggressive
!
interface range GigabitEthernet1/0/1 - 24
 description user access, floor 1
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 switchport nonegotiate
 spanning-tree portfast edge
 spanning-tree bpduguard enable
 switchport port-security maximum 3
 switchport port-security violation restrict
 switchport port-security aging time 2
 switchport port-security aging type inactivity
 switchport port-security
 storm-control broadcast level 1.00
 storm-control multicast level 5.00
 storm-control action trap
 ip dhcp snooping limit rate 15
interface range GigabitEthernet1/0/25 - 44
 description user access, floor 2
 switchport mode access
 switchport access vlan 11
 switchport voice vlan 20
 switchport nonegotiate
 spanning-tree portfast edge
 spanning-tree bpduguard enable
 switchport port-security maximum 3
 switchport port-security violation restrict
 switchport port-security aging time 2
 switchport port-security aging type inactivity
 switchport port-security
 storm-control broadcast level 1.00
 storm-control multicast level 5.00
 storm-control action trap
 ip dhcp snooping limit rate 15
!
interface range GigabitEthernet1/0/45 - 48
 description UNUSED - parked and shut down
 switchport mode access
 switchport access vlan 999
 switchport nonegotiate
 spanning-tree bpduguard enable
 no cdp enable
 shutdown
!
interface Vlan1
 no ip address
 shutdown
interface Vlan30
 description MANAGEMENT
 ip address 192.0.2.30 255.255.255.0
 no ip redirects
 no ip unreachables
 no ip proxy-arp
 no shutdown
ip default-gateway 192.0.2.1
!
ip access-list standard MGMT-ACCESS
 permit 192.0.2.128 0.0.0.31
 permit 198.51.100.0 0.0.0.15
 deny any log
!
boot system flash:packages.conf
redundancy
 mode sso
stack-mac persistent timer 0
