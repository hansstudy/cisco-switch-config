! cisco-switch-config hardened baseline for DIST-SW-01
! generated by gen_baseline.py (skill 1.0.0) from spec sha256 2686a486734de005a3b08a3a7d194a70f3b6661018faad2b90ee87e8c2278ffb
! platform iosxe, role distribution
! Fill every REPLACE-ME placeholder on the device before this configuration is used.
!
hostname DIST-SW-01
ip domain-name example.invalid
!
service password-encryption
service tcp-keepalives-in
service tcp-keepalives-out
no service pad
no service tcp-small-servers
no service udp-small-servers
no service config
no service call-home
no ip finger
no ip bootp server
no ip source-route
no ip domain-lookup
no ip http server
no ip http secure-server
no vstack
no cdp run
!
enable algorithm-type scrypt secret <REPLACE-ME:enable-secret>
username admin privilege 15 algorithm-type scrypt secret <REPLACE-ME:local-admin-secret>
!
aaa new-model
tacacs server TACACS-1
 address ipv4 198.51.100.10
 key <REPLACE-ME:tacacs-key>
 timeout 5
tacacs server TACACS-2
 address ipv4 198.51.100.11
 key <REPLACE-ME:tacacs-key>
 timeout 5
aaa group server tacacs+ TACACS-GRP
 server name TACACS-1
 server name TACACS-2
 ip tacacs source-interface Vlan99
aaa authentication login default group TACACS-GRP local
aaa authentication enable default group TACACS-GRP enable
aaa authorization console
aaa authorization exec default group TACACS-GRP local if-authenticated
aaa accounting exec default start-stop group TACACS-GRP
aaa accounting commands 15 default start-stop group TACACS-GRP
!
login block-for 120 attempts 3 within 60
login on-failure log
login on-success log
banner motd ^C
Authorized access only. This system is the property of its owner and is monitored;
all activity may be recorded. By continuing you consent to this monitoring.
Unauthorized use is prohibited and may be prosecuted.
^C
!
line con 0
 exec-timeout 10 0
 logging synchronous
 login authentication default
line aux 0
 no exec
 transport input none
 transport output none
line vty 0 15
 access-class MGMT-ACCESS in
 exec-timeout 10 0
 login authentication default
 transport input ssh
 transport output ssh
!
crypto key generate rsa modulus 4096
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
ip ssh dh min size 4096
ip ssh source-interface Vlan99
ip ssh server algorithm encryption aes256-gcm aes256-ctr
ip ssh server algorithm mac hmac-sha2-512 hmac-sha2-256
ip ssh server algorithm kex ecdh-sha2-nistp384 ecdh-sha2-nistp256
!
snmp-server group RO-GROUP v3 priv access MGMT-ACCESS
snmp-server user monuser RO-GROUP v3 auth sha <REPLACE-ME:snmpv3-auth> priv aes 256 <REPLACE-ME:snmpv3-priv>
snmp-server enable traps snmp authentication linkdown linkup coldstart warmstart
snmp-server enable traps config
snmp ifmib ifindex persist
!
ntp authenticate
ntp authentication-key 1 hmac-sha2-256 <REPLACE-ME:ntp-key-1>
ntp trusted-key 1
ntp source Vlan99
ntp server 198.51.100.123 key 1
!
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
logging buffered 64000 informational
logging console critical
logging trap informational
logging source-interface Vlan99
logging host 198.51.100.30
!
archive
 log config
  logging enable
  logging size 500
  notify syslog contenttype plaintext
  hidekeys
 path flash:archive
 write-memory
!
vtp mode transparent
vlan 10
 name DATA
vlan 20
 name VOICE
vlan 99
 name MGMT
vlan 999
 name NATIVE-UNUSED
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree portfast edge bpduguard default
spanning-tree loopguard default
spanning-tree vlan 10,20,99,999 priority 4096
udld enable
!
ip dhcp snooping vlan 10,20
no ip dhcp snooping information option
ip dhcp snooping database flash:dhcp-snooping.db
ip dhcp snooping
ip arp inspection vlan 10,20
ip arp inspection validate src-mac dst-mac ip
errdisable recovery cause bpduguard
errdisable recovery cause psecure-violation
errdisable recovery cause dhcp-rate-limit
errdisable recovery cause arp-inspection
errdisable recovery cause udld
errdisable recovery cause storm-control
errdisable recovery interval 300
!
