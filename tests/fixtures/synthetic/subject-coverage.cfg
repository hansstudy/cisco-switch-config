!
! Synthetic fixture: Catalyst 9300-class access switch, IOS-XE 17.9, authored-config form.
! Hand-authored for this project (Apache-2.0). RFC 5737 / RFC 1918 addressing, no secrets.
! Purpose: give every catalogue `subject` token-prefix that no other
! fixture exercises at least one real line, so tests/test_contract_reconciliation.py can
! detect a subject list that has rotted. The `crypto key generate` line is an authored-config
! (baseline) form, as gen_baseline.py emits; it never appears in a device's running-config.
!
version 17.9
hostname LAB-SUBJ-01
!
no cdp run
!
ip domain name example.invalid
crypto key generate rsa modulus 2048
!
login block-for 120 attempts 5 within 60
login on-failure log
login on-success log
!
netconf-yang
restconf
!
interface GigabitEthernet1/0/10
 description printer, fixed speed
 switchport mode access
 switchport access vlan 10
 speed 100
 duplex full
!
! CSC-MGT-0014 subject coverage: the IOS form is `ip access-group`, not `access-group`
! (that spelling is the vty/line form, CSC-VTY-0003's own subject).
interface Vlan10
 ip access-group MGT-VLAN-ACL in
!
! CSC-RES-0006 subject coverage: `stack-mac persistent timer`, gated on stack evidence
! (`switch 1 provision ...`).
switch 1 provision C9300-48P
stack-mac persistent timer 0
!
! CSC-STP-0008 subject coverage: an explicit root-priority line under the MST form, not
! the `spanning-tree vlan` form this fixture's siblings already cover.
spanning-tree mst configuration
 name REGION1
 revision 1
spanning-tree mst 0 priority 4096
!
end
