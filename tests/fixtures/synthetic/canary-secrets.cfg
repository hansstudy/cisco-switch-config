!
! AC15 primary fixture. Hand-authored for this project
! (Apache-2.0). Every secret-shaped value is drawn from the frozen canary vocabulary
! or is an obvious `CANARY...` derivative of it -- none of this is a real device
! configuration. RFC 5737 / RFC 1918 addressing and example.invalid names throughout.
!
! This fixture intentionally is not "clean": it exists to give the masker one real,
! in-context occurrence of every secret-bearing construct the masking table recognises,
! one canary in every placement mode the masker handles, the default-deny / reference / no-value
! three-way split, and the placeholder-exemption pair. It is not audited for hardening
! posture and is not used by AC6.
!
version 17.9
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname LAB-SW01
!
ip domain-name example.invalid
!
! -- global secrets: enable, local users, master key, licensing -----------------------------
enable password level 15 7 CANARY7-0822455D0A16
enable password 7 CANARY7-ENABLEPW-0001
enable secret level 15 5 $1$CANARY0003
enable secret 9 $9$CANARY-ENABLESEC-0001
enable algorithm-type sha256 secret CANARY-ENABLESEC-0002
!
username admin privilege 15 secret 9 $9$CANARY0001
username ops view NOC secret 8 $8$CANARY0002
username legacyuser password 7 CANARY7-LOCALPW-0001
username otpuser algorithm-type sha256 secret CANARY-ALGSEC-0001
username otpuser2 one-time secret CANARY-ONETIME-0001
!
key config-key password-encrypt CANARY-MASTER-KEY-01
license smart trust idtoken CANARY-IDTOKEN-01 local force
!
parser view NOC
 secret 5 CANARY-PARSERVIEW-0001
!
! -- unknown construct: default-deny direction -----------------------------------------------
foo-server key 7 CANARY-UNKNOWN-01 extra
!
! -- placeholder exemption: exact match survives, near-miss is redacted ---------------------
tacacs-server key 0 <REPLACE-ME:tacacs-key>
radius-server key 0 <REPLACE-ME:tacacs-key>CANARY
!
! -- reference forms that must survive intact ------------------------------------------------
ntp server 10.0.0.1 key 1
ntp trusted-key 1
ip ospf authentication key-chain CHAIN1
!
! -- NTP authentication keys: one of the constructs the whole audit depends on -----------------
ntp authentication-key 1 md5 CANARY-NTP-KEY-01 7
ntp authentication-key 2 hmac-sha2-256 CANARY-NTP-KEY-02 7
ntp authentication-key 3 hmac-sha1 CANARY-NTP-KEY-03
ntp authentication-key 4 cmac-aes-128 CANARY-NTP-KEY-04
!
! -- AAA: TACACS+ / RADIUS / CoA -------------------------------------------------------------
tacacs-server key 7 CANARY7-TACACSKEY-0001
tacacs-server host 198.51.100.10 key 7 CANARY7-TACACSKEY-0002
!
tacacs server ISE1
 address ipv4 198.51.100.11
 key 7 CANARY-TACACS-KEY-01
!
radius-server key 7 CANARY-RADIUS-KEY-01
radius-server host 198.51.100.12 key 7 CANARY7-RADIUSKEY-0002
!
radius server RS1
 address ipv4 198.51.100.13 auth-port 1812 acct-port 1813
 key 7 CANARY7-RADIUSKEY-0003
 pac key 7 CANARY7-PACKEY-0001
!
aaa group server tacacs+ TACACS-GRP
 server name ISE1
 server-private 198.51.100.14 auth-port 49 key 7 CANARY7-SRVPRIV-0001
!
aaa server radius dynamic-author
 client 198.51.100.15 server-key 7 CANARY7-COA-0001
!
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting commands 15 default start-stop group tacacs+
!
! -- SNMP -------------------------------------------------------------------------------------
snmp-server community CANARY-COMMUNITY-01 RO 99
snmp-server community-map CANARY-COMMUNITY-MAP-01 context vlan-10
snmp-server host 192.0.2.10 version 2c CANARY-COMMUNITY-02 config envmon
snmp-server host 192.0.2.10 vrf MGMT informs version 2c CANARY-COMMUNITY-03
snmp-server host 192.0.2.10 version 3 priv monuser
snmp-server user mon RO-GRP v3 auth sha CANARY-AUTH-02 access 99
snmp-server user u2 grp remote 10.0.0.9 v3 auth md5 CANARY-AUTH-03
snmp-server user u3 grp v3 auth sha CANARY-AUTH-04 priv aes 128 CANARY-PRIV-01
!
! -- FTP / HTTP client / proxy credentials -----------------------------------------------------
ip ftp password 7 CANARY7-FTPPW-0001
ip http client password 7 CANARY7-HTTPCLIENTPW-0001
ip http client proxy-server http://svc:CANARY-URL-PW-03@proxy.example.invalid:8080
!
boot system flash:cat9k_iosxe.17.09.04a.SPA.bin
boot system http://svc:CANARY-URL-PW-04@192.0.2.9/image.bin
boot host http://svc:CANARY-URL-PW-09@192.0.2.9/hostconfig
!
! -- generic, command-agnostic URL userinfo: a command the $URL row list
! never named, and a scheme-less `user:pw@host` form in yet another such command ------------
ip dhcp snooping database ftp://svc:CANARY-URL-PW-08@198.51.100.9/snoop
!
archive
 path ftp://svc:CANARY-URL-PW-01@198.51.100.9/cfg
 log config
  logging enable
  hidekeys
!
kron policy-list KP1
 cli copy running-config ftp://svc:CANARY-URL-PW-05@198.51.100.9/cfg
!
call-home
 http-proxy svc:CANARY-URL-PW-07@proxy.example.invalid:8080
 mail-server smtp://svc:CANARY-URL-PW-12@mail.example.invalid priority 1
 profile LAB-PROFILE
  destination address http https://svc:CANARY-URL-PW-06@case.example.invalid/
!
! -- SSH pubkey chain: key-hash and key-string body --------------------------------------------
ip ssh pubkey-chain
 username bob
  key-hash ssh-rsa CANARYHASH01
 username carol
  key-string
   CANARY-PUBKEY-BODY-LINE-0001AAAABBBBCCCCDDDDEEEEFFFF00001111
   CANARY-PUBKEY-BODY-LINE-0002AAAABBBBCCCCDDDDEEEEFFFF00002222
  quit
!
! -- Event manager: applet + environment --------------------------------------------------------
event manager environment _snmp_community CANARY-COMMUNITY-05
event manager environment _snmp_ro CANARY-EEM-SNMPRO-01
event manager applet LAB-APPLET
 event tag 1 syslog pattern "LINK-3-UPDOWN"
 action 1.0 cli command "snmp-server community CANARY-COMMUNITY-04 RO"
 action 2.0 cli command "snmp-server host 10.0.0.1 version 2c CANARY-COMMUNITY-06"
 action 3.0 cli command "enable"
 action 3.1 cli command "CANARY-EEM-PROMPTANSWER-01"
 action 3.2 set pw "CANARY-EEM-SETPW-01"
!
! -- misc credential-bearing features -----------------------------------------------------------
cts sxp default password 7 CANARY7-CTSSXP-0001
!
dot1x credentials DOT1XPROF
 password 7 CANARY7-DOT1X-0001
!
sip-ua
 credentials username sipuser password 7 CANARY7-SIP-0001
!
wsma agent config password 7 CANARY7-WSMA-0001
!
pnp profile PNP-PROF
 password 7 CANARY7-PNP-0001
!
vtp password CANARY-VTP-PW-01 hidden
!
! -- VTY / console / aux lines --------------------------------------------------------------------
line con 0
 exec-timeout 10 0
 password 7 CANARY7-CONPW-0001
 logging synchronous
line aux 0
 password 7 CANARY7-AUXPW-0001
 no exec
line vty 0 4
 password 7 CANARY7-VTYPW-0001
 transport input ssh
line vty 5 15
 transport input ssh
 key config-key password-encrypt CANARY-MASTERKEY-UNDERVTY-01
!
! -- unchanged AAA/dot1x/ppp method lines (no-value guards, NOT redacted) -----------------------
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting commands 15 default start-stop group tacacs+
 authentication port-control auto
 ppp authentication chap pap
login authentication default
authentication order dot1x mab
!
! -- routing protocols: OSPF classic, OSPFv3 IPsec family, EIGRP, ISIS, BGP, RIP -----------------
key chain CHAIN1
 key 1
  key-string 7 CANARY7-KEYCHAIN-0001
!
router ospf 1
 router-id 198.51.100.1
 network 192.0.2.0 0.0.0.255 area 0
!
router ospfv3 1
 area 0 authentication ipsec spi 503 sha1 CANARYHEX05
 area 1 encryption ipsec spi 504 esp null sha1 CANARYHEX06
 area 2 encryption ipsec spi 509 esp aes-cbc 128 7 CANARYHEX13 sha1 7 CANARYHEX14
!
ospfv3 1 authentication ipsec spi 502 sha1 CANARYHEX04
ospfv3 1 encryption ipsec spi 507 esp null sha1 7 CANARYHEX10
ospfv3 1 encryption ipsec spi 508 esp aes-cbc 128 7 CANARYHEX11 sha1 7 CANARYHEX12
!
router eigrp LAB-EIGRP-VRF
 address-family ipv4 unicast autonomous-system 1
  af-interface default
   authentication mode hmac-sha-256 0 CANARY-EIGRP-01
  exit-af-interface
 exit-address-family
!
router isis
 area-password CANARY-ISIS-AREA-01
 domain-password CANARY-ISIS-DOMAIN-01
!
router bgp 65000
 neighbor 198.51.100.2 remote-as 65001
 neighbor 198.51.100.2 password 7 CANARY7-BGP-0001
!
mpls ldp neighbor 198.51.100.3 password 7 CANARY7-LDP-0001
ip msdp password peer 198.51.100.4 7 CANARY7-MSDP-0001
!
router lisp
 authentication-key CANARY-LISP-01
!
! -- crypto: ISAKMP, keyrings, IKEv2, PKI ----------------------------------------------------------
crypto isakmp key CANARY-PSK-01 address 10.0.0.1
!
crypto keyring KR1
 pre-shared-key address 198.51.100.5 key 7 CANARY7-KEYRING-0001
!
crypto ikev2 keyring IKV2KR
 peer PEER1
  address 198.51.100.16
  pre-shared-key local 0 CANARY-PSK-02
!
crypto ikev2 profile IKEV2PROF
 authentication local pre-share key 7 CANARY7-IKEV2PROF-0001
!
crypto pki trustpoint TP1
 enrollment url http://svc:CANARY-URL-PW-02@ca.example.invalid/certsrv
 password 7 CANARY7-PKICHALLENGE-0001
!
crypto pki certificate chain TP1
 certificate 01
  3082 CANARY-CERTBODY-0001AAAA BBBBCCCC DDDDEEEE
  FFFF0000 CANARY-CERTBODY-0002BBBB
  quit
!
certificate self-signed 02
 3082 CANARY-SELFSIGNED-0001AAAA BBBBCCCC DDDDEEEE
 quit
!
! -- crypto key export/import passphrases (masked, not treated as no-value); both the
! `pem terminal` and `pem url` forms of each direction --------------------------------------
crypto key export rsa MYKEY pem terminal 3des CANARY-KEYEXPORT-01
crypto key export rsa MYKEY pem url flash:mykey-pub.pem 3des CANARY-KEYEXPORT-02
crypto key import rsa MYKEY general-purpose pem terminal CANARY-KEYIMPORT-01
crypto key import rsa MYKEY general-purpose pem url flash:mykey.pem CANARY-KEYIMPORT-02
!
crypto key pubkey-chain rsa
 named-key LAB-NAMEDKEY.example.invalid
  key-string
   CANARY-RSAKEY-BODY-0001AAAABBBBCCCCDDDDEEEEFFFF
  quit
!
! -- interfaces: physical, range, tunnel, routed --------------------------------------------------
interface GigabitEthernet1/0/1
 ip ospf message-digest-key 1 md5 7 CANARY7-0822455D0A17
 ip ospf authentication-key 7 CANARY7-OSPFAUTH-0001
 ipv6 ospf authentication ipsec spi 500 md5 7 CANARYHEX01
 ipv6 ospf encryption ipsec spi 505 esp null sha1 7 CANARYHEX07
 ipv6 ospf encryption ipsec spi 506 esp aes-cbc 128 7 CANARYHEX08 sha1 7 CANARYHEX09
 ip rip authentication key-string 7 CANARY7-RIPKEY-0001
 isis password 7 CANARY7-ISISIFACE-0001
 standby 1 authentication text CANARY-HSRP-01
 standby 2 authentication md5 key-chain HSRP-KC
 standby 3 authentication md5 key-string 7 CANARY7-HSRP-0002
 vrrp 1 authentication text CANARY-VRRP-01
 glbp 1 authentication text CANARY-GLBP-01
!
interface range GigabitEthernet1/0/40 - 42
 standby 4 authentication text CANARY-RANGE-01
!
interface Tunnel1
 tunnel source GigabitEthernet1/0/1
 tunnel destination 198.51.100.20
 ip nhrp authentication CANARY-NHRP-01
!
interface Serial0/0/0
 ppp chap password 7 CANARY7-PPPCHAP-0001
 ppp pap sent-username pappeer password 7 CANARY7-PPPPAP-0001
!
! -- Wireless: WLAN PSK, mobility group, AP credentials --------------------------------------------
wlan LAB-WLAN 1 LAB-WLAN-SSID
 security wpa psk set-key ascii 0 CANARY-WLANPSK-01
!
wireless mobility group
 member ip 198.51.100.6 public-ip 198.51.100.6 key 7 CANARY7-MOBILITY-0001
!
ap dot1x username apuser password 7 CANARY7-APDOT1X-0001
ap mgmtuser username apadmin password 7 CANARY7-APMGMT-0001 secret 7 CANARY7-APMGMTSEC-0001
!
! -- banner body: default-deny redacts trailing text after a trigger keyword inside the body -----
banner motd ^C
This device is LAB-SW01, a synthetic fixture. Support key CANARY-BANNER-01 is for lab use.
^C
!
end
