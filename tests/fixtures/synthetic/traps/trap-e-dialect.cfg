!
! trap-e-dialect.cfg -- IOS vs IOS-XE keyword variants. Hand-authored
! for this project (Apache-2.0). A hardened Catalyst 9300 on IOS-XE 17.9 whose interface
! reads `spanning-tree portfast edge bpduguard default` must NOT be told BPDU Guard is
! missing just because the classic-IOS spelling (`spanning-tree portfast bpduguard default`)
! is absent -- `ctx.dialect.matches(...)` must recognise both per-platform surface forms.
!
version 17.9
hostname TRAP-E-DIALECT
!
device-tracking policy IFC-POLICY
 limit address-count 4
 tracking enable
!
spanning-tree mode rapid-pvst
! IOS-XE surface form (with `edge`), not the classic-IOS form:
spanning-tree portfast edge bpduguard default
!
license boot level network-advantage
ip http secure-active-session-modules none
!
interface GigabitEthernet1/0/1
 description IOS-XE dialect access port
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast edge
!
end
