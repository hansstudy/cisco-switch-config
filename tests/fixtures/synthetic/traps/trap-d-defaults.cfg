!
! trap-d-defaults.cfg -- implicit defaults. Hand-authored for this
! project (Apache-2.0). Nothing below sets `exec-timeout`, disables `cdp run`, or gives
! GigabitEthernet1/0/2 an explicit `switchport mode` -- each absence must be read through
! `ctx.defaults.effective(...)`, never `not cfg.has(...)`, and must resolve to the
! platform's implicit value (10-minute exec-timeout, CDP on, DTP-dynamic port) rather than
! "missing".
!
hostname TRAP-D-DEFAULTS
!
! no `cdp run` / `no cdp run` anywhere: CDP is on by platform default
!
interface GigabitEthernet1/0/1
 description no explicit switchport mode: DTP-dynamic by platform default (CSC-L2-0007)
 switchport access vlan 10
!
interface GigabitEthernet1/0/2
 description a normal access port, for contrast
 switchport mode access
 switchport access vlan 10
!
line con 0
 logging synchronous
! no exec-timeout on line con 0: platform default is 10 minutes, not "unset"
!
line vty 0 4
 transport input ssh
! no exec-timeout on the vty lines either
!
end
