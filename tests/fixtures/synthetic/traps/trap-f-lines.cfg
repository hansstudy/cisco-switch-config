!
! trap-f-lines.cfg -- all-lines semantics. Hand-authored for this
! project (Apache-2.0). `line vty 0 4` is fully hardened; `line vty 5 15` is never mentioned
! at all. `Config.line_ranges("vty")` must return the FULL declared universe (0-15 on IOS-XE
! Catalyst), the unshown 5-15 sub-range with `observed=False` and `node=None`, evaluated
! against the defaults table ("present at defaults") -- and a check must pass only when
! EVERY returned sub-range passes. One CSC-SELF-0006 note must fire for the assumed range.
!
version 17.9
hostname TRAP-F-LINES
!
ip access-list standard VTY-ACL
 permit 192.0.2.0 0.0.0.255
!
line con 0
 exec-timeout 10 0
 logging synchronous
line aux 0
 no exec
 transport input none
!
line vty 0 4
 access-class VTY-ACL in
 exec-timeout 10 0
 transport input ssh
 transport output ssh
! line vty 5 15 is never configured -- the assumed sub-range
!
end
