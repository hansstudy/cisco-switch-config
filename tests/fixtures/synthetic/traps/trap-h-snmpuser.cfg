!
! trap-h-snmpuser.cfg -- `snmp-server user` is not displayed in
! `show running-config`. Hand-authored for this project (Apache-2.0). This fixture carries
! `snmp-server group ... v3 priv` -- which IS displayed -- but deliberately carries NO
! `snmp-server user` line at all, because a real `show running-config` never would. Any rule
! that concludes "no SNMPv3 users configured" from this file's absence of `snmp-server user`
! is asserting something the input cannot support, and is forbidden. CSC-SNMP-0006 (no v3 group with priv) must NOT fire here, since
! a `priv` group IS present; CSC-SNMP-0010's extractor should surface this group for the
! operator to confirm against `show snmp user` -- an `info`/`manual-review` finding, not a
! presence verdict.
!
hostname TRAP-H-SNMPUSER
!
snmp-server group MON-GRP v3 priv
snmp-server group MON-GRP v3 priv read MON-VIEW write MON-VIEW
snmp-server view MON-VIEW iso included
!
! No `snmp-server user` line anywhere below -- authentic to what `show running-config`
! actually prints when the switch was configured via `snmp-server user` interactively.
!
end
