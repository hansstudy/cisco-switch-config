!
! trap-c-ranges.cfg -- interface-range expansion. Hand-authored for
! this project (Apache-2.0). RFC 5737 addressing.
!
hostname TRAP-C-RANGES
!
define interface-range ACCESS-BLOCK GigabitEthernet1/0/13 - 24
!
! -- dash form, no spacing around `-`: must parse identically to spaced form (r1 note N4) ---
interface range Gi1/0/1-12
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast edge
!
! -- dash form, spaced -----------------------------------------------------------------------
interface range GigabitEthernet1/0/25 - 36
 switchport mode access
 switchport access vlan 10
!
! -- comma-separated segments, mixed single-interface and dash-range members -----------------
interface range Gi1/0/37 - 40, Gi1/0/45, Gi1/0/46 - 48
 switchport mode access
 switchport access vlan 999
 shutdown
!
! -- `interface range macro`, resolving against the `define interface-range` above -----------
interface range macro ACCESS-BLOCK
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
!
! -- an unresolvable macro: no members, one CSC-SELF-0004 note, and parsing continues --------
interface range macro NO-SUCH-MACRO
 switchport mode access
!
! -- a range member that ALSO has its own standalone block: the two must be merged, with the
! standalone block's node winning on conflict and the children being the union, range
! children first (the `interfaces()` dedup rule) -----------------------------------------------
interface range GigabitEthernet1/0/41 - 44
 switchport mode access
 switchport access vlan 10
 description from the range
!
interface GigabitEthernet1/0/42
 description from the standalone block, must win on conflict
 switchport port-security
 switchport port-security maximum 1
!
end
