!
! trap-a-banners.cfg -- both banner delimiter forms, a 0x03
! single-byte delimiter variant, `enable password` inside a banner body (must NOT fire
! a cleartext-password finding), and one properly-unterminated banner (must close at
! EOF with exactly one CSC-SELF-0005 note). Hand-authored for this project (Apache-2.0).
! Frozen canary vocabulary throughout; RFC 5737 / RFC 1918 addressing.
!
hostname TRAP-A-BANNERS
!
! -- (1) single-line delimiter form: the block closes ON THE SAME LINE. Everything
! after this line is ordinary configuration and MUST still parse. -------
banner motd ^CUnauthorized access is prohibited^C
!
aaa new-model
aaa authentication login default local
!
username single-line-survivor privilege 15 secret 9 $9$CANARY-TRAPA-0001
!
vlan 10
 name DATA
vlan 20
 name VOICE
!
interface GigabitEthernet1/0/1
 description proves the parser did not stay inside the single-line banner
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 spanning-tree portfast edge
 spanning-tree bpduguard enable
!
interface GigabitEthernet1/0/2
 description second interface, twenty-plus lines after the single-line banner
 switchport mode access
 switchport access vlan 10
!
interface Vlan10
 ip address 192.0.2.1 255.255.255.0
!
ip access-list standard 10
 permit 192.0.2.0 0.0.0.255
!
line con 0
 exec-timeout 10 0
line vty 0 4
 access-class 10 in
 transport input ssh
!
! -- (2) multi-line delimiter form, closing on the line carrying the delimiter --------
! Contains a bare `enable password` INSIDE the body: this must be masked as ordinary
! banner-body text (default-deny redacts from the trigger keyword to end of line) and
! must NOT fire a cleartext-password finding -- the body is never structurally parsed.
banner exec ^C
Unauthorized access is prohibited.
Sample text an attacker might paste: enable password CANARY-TRAPA-BANNERBODY-01
All activity is monitored and recorded. By continuing you consent to this monitoring.
^C
!
! -- (3) the 0x03 single-byte delimiter variant (accept both `^C` the two characters
! and the single 0x03 byte) -----------------------------------------------------------
banner incoming Restricted access. Canary LAB-TRAPA-0X03-01.
!
! -- (4) unterminated banner: no closing delimiter anywhere below. Must close at EOF,
! emit exactly one CSC-SELF-0005 note (`unterminated banner block opened at line N`),
! and must NOT abort the run (exit 2 is reserved for empty/non-Cisco input only). -----
banner login ^C
This banner is deliberately never closed. Canary LAB-TRAPA-UNTERM-01 lives here.
Nothing below this point is structurally parsed; it is all opaque banner body.
