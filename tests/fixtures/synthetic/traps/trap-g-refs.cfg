!
! trap-g-refs.cfg -- referential checks. Hand-authored for this
! project (Apache-2.0). `access-class 10` names an ACL that is never defined; the SNMP
! community's ACL `99` is never defined; the NTP key has no matching `trusted-key`; the
! native VLAN on the trunk equals an access VLAN in active use elsewhere. Every one of these
! must be resolvable from masked text alone (ACL numbers, key ids and access modes
! survive redaction) via `ciscocheck.refs.ReferenceIndex`.
!
hostname TRAP-G-REFS
!
snmp-server community CANARY-COMMUNITY-TRAPG-01 RO 99
! ACL 99 is referenced above but never defined anywhere in this file
!
ntp authentication-key 5 sha1 CANARY-NTP-KEY-TRAPG-01
ntp server 198.51.100.50 key 5
! no `ntp trusted-key 5` anywhere -- the key is bound but never trusted
!
vlan 10
 name DATA
!
interface GigabitEthernet1/0/1
 description access port actively using VLAN 10
 switchport mode access
 switchport access vlan 10
!
interface TenGigabitEthernet1/1/1
 description trunk whose native VLAN collides with the access VLAN in use above
 switchport mode trunk
 switchport trunk native vlan 10
 switchport trunk allowed vlan 10,20
!
line vty 0 4
 access-class 10 in
 transport input ssh
! access-class 10 refers to an ACL that is never defined (note: this is deliberately the
! SAME number as VLAN 10 above -- an ACL number and a VLAN id are different namespaces)
!
end
