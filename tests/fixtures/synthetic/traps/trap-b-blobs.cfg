!
! trap-b-blobs.cfg -- certificate/key opaque blocks through `quit`.
! Hand-authored for this project (Apache-2.0). Frozen canary vocabulary throughout.
!
hostname TRAP-B-BLOBS
!
! -- a complete, properly-terminated certificate chain: opener and `quit` survive as
! ordinary lines; every body line between them becomes one opaque-body redaction token on
! the first body line (full character count) and length-0 continuation tokens after it. ----
crypto pki certificate chain TP-GOOD
 certificate 01
  3082 CANARY-TRAPB-GOODCERT-01AAAA BBBBCCCC DDDDEEEE
  FFFF0000 1111AAAA CANARY-TRAPB-GOODCERT-02BBBB
  CCCCDDDD EEEEFFFF 00001111 CANARY-TRAPB-GOODCERT-03
  quit
!
! -- a self-signed certificate, the mode-"" form of the same construct row -------------------
certificate self-signed 02
 3082 CANARY-TRAPB-SELFSIGNED-01AAAA BBBBCCCC
 quit
!
! -- crypto key pubkey-chain rsa: named-key -> key-string -> quit ---------------------------
crypto key pubkey-chain rsa
 named-key LAB-TRAPB-NAMEDKEY.example.invalid
  key-string
   CANARY-TRAPB-RSAKEY-BODY-01AAAABBBBCCCCDDDD
   CANARY-TRAPB-RSAKEY-BODY-02EEEEFFFF00001111
  quit
 addressed-key 198.51.100.40
  key-string
   CANARY-TRAPB-RSAKEY-BODY-03AAAABBBBCCCCDDDD
  quit
!
! -- proves parsing continues normally after a properly-closed blob -------------------------
interface Loopback0
 description proves the parser is back in structural mode after the pubkey-chain block
 ip address 198.51.100.41 255.255.255.255
!
! -- a TRUNCATED certificate chain: opener and body present, `quit` never appears. Per the
! failure policy this must close at EOF (or, since this is not the last construct in a real
! trap file, at least degrade gracefully rather than crash), emitting CSC-SELF-0005 and
! swallowing everything after it as body content. This block is therefore placed LAST so its
! EOF-closure behaviour is exercised precisely. ---------------------------------------------
crypto pki certificate chain TP-TRUNCATED
 certificate 03
  3082 CANARY-TRAPB-TRUNCATED-01AAAA BBBBCCCC
  DDDDEEEE CANARY-TRAPB-TRUNCATED-02FFFF
