!
! Synthetic fixture: 48-port campus access switch, IOS-XE 17.6, Catalyst 9300-class.
! Hand-authored for this project (Apache-2.0). Mixed-quality posture: some hardening applied,
! some gaps left in place on purpose, so this fixture is a middle case between
! hardened-reference.cfg and deliberately-bad.cfg. RFC 5737 / RFC 1918 addressing throughout.
!
version 17.6
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname ACC-9300-12
!
no ip http server
ip http secure-server
ip domain-name example.invalid
!
enable secret 9 $9$CANARY-CAMPUS-01
username svc_backup privilege 1 secret 9 $9$CANARY-CAMPUS-02
!
aaa new-model
aaa authentication login default group TACACS-GRP local
aaa authorization exec default group TACACS-GRP local
!
tacacs server ISE1
 address ipv4 198.51.100.10
 key 7 CANARY7-CAMPUS0001AA
!
aaa group server tacacs+ TACACS-GRP
 server name ISE1
!
vlan 10
 name DATA
vlan 20
 name VOICE
vlan 30
 name MGMT
vlan 999
 name PARKING
!
vtp mode transparent
!
spanning-tree mode rapid-pvst
spanning-tree portfast edge bpduguard default
!
ip dhcp snooping vlan 10,20
ip dhcp snooping
!
interface Vlan30
 description mgmt SVI
 ip address 192.0.2.5 255.255.255.0
!
interface GigabitEthernet1/0/1
 description user port 1
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 spanning-tree portfast edge
!
interface GigabitEthernet1/0/2
 description user port 2
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
!
interface GigabitEthernet1/0/3
 description printer, no voice
 switchport mode access
 switchport access vlan 10
!
interface GigabitEthernet1/0/47
 description unused
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface GigabitEthernet1/0/48
 description unused
 shutdown
!
interface TenGigabitEthernet1/1/1
 description uplink to DIST-01
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 switchport trunk native vlan 999
 switchport nonegotiate
 ip dhcp snooping trust
!
ntp server 198.51.100.123
!
snmp-server group MON-GRP v3 priv
snmp-server host 198.51.100.20 version 3 priv monuser
!
logging host 198.51.100.30
!
ip ssh version 2
!
line con 0
 exec-timeout 10 0
 logging synchronous
line vty 0 4
 access-class 10 in
 exec-timeout 10 0
 transport input ssh
line vty 5 15
 transport input ssh
!
ip access-list standard 10
 permit 192.0.2.0 0.0.0.255
!
end
