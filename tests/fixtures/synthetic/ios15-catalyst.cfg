!
! Synthetic fixture: classic IOS 15.2(4)E dialect, Catalyst 2960-X.
! Hand-authored for this project (Apache-2.0). Exercises the IOS (not IOS-XE) surface forms
! of the dialect table: `spanning-tree portfast` (no `edge`), `ip device
! tracking` (not `device-tracking policy`), classic `boot system flash:` naming.
!
version 15.2
service timestamps log datetime msec localtime show-timezone
service password-encryption
!
hostname C2960X-ACC-04
!
no ip http server
ip domain-name example.invalid
!
enable secret 5 $1$CA$CANARY0003xxxxxxxxxxxxxxx
username noc privilege 15 secret 5 $1$CA$CANARY0004xxxxxxxxxxxxxxx
!
aaa new-model
aaa authentication login default group RADIUS-GRP local
!
radius server AAA1
 address ipv4 192.0.2.15 auth-port 1812 acct-port 1813
 key 7 CANARY7-IOS150001AA
!
aaa group server radius RADIUS-GRP
 server name AAA1
!
vlan 10
 name DATA
vlan 20
 name VOICE
!
spanning-tree mode rapid-pvst
spanning-tree portfast bpduguard default
!
ip device tracking
!
interface FastEthernet0/1
 description user port
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 spanning-tree portfast
!
interface FastEthernet0/2
 description unused
 shutdown
!
interface GigabitEthernet0/1
 description uplink to DIST
 switchport mode trunk
 switchport trunk allowed vlan 10,20
!
boot system flash:c2960x-universalk9-mz.152-7.E5.bin
!
ntp server 192.0.2.123
!
snmp-server community CANARY-COMMUNITY-IOS15 RO 88
ip access-list standard 88
 permit 192.0.2.0 0.0.0.255
!
line con 0
 exec-timeout 10 0
line vty 0 4
 access-class 10 in
 transport input ssh
line vty 5 15
 access-class 10 in
 transport input ssh
!
ip access-list standard 10
 permit 192.0.2.0 0.0.0.255
!
end
