!
! Synthetic fixture: fully hardened Catalyst 9300, IOS-XE 17.9 dialect.
! Hand-authored for this project (Apache-2.0). All addressing is RFC 5737 / RFC 1918.
! Canary vocabulary used for every secret-shaped value (see tests/fixtures/ATTRIBUTION.md).
! Must yield zero `critical` and zero `high` findings when audited (AC6).
!
version 17.9
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
service password-encryption
no service pad
no service config
no service call-home
no service finger
no service tcp-small-servers
no service udp-small-servers
!
hostname DIST-9300-01
!
no ip source-route
no ip bootp server
no ip http server
ip http secure-server
ip http access-class 90
ip domain-lookup
ip domain-name example.invalid
ip name-server 192.0.2.53
!
no vstack
!
enable secret 9 $9$CANARY-HARD-0001
!
username netadmin privilege 15 secret 9 $9$CANARY-HARD-0002
!
aaa new-model
aaa authentication login default group TACACS-GRP local
aaa authentication enable default group TACACS-GRP enable
aaa authorization exec default group TACACS-GRP local
aaa authorization console
aaa authorization commands 15 default group TACACS-GRP local
aaa accounting commands 15 default start-stop group TACACS-GRP
aaa accounting exec default start-stop group TACACS-GRP
!
tacacs server ISE-PRIMARY
 address ipv4 192.0.2.10
 key 7 CANARY7-0011223344AA
tacacs server ISE-SECONDARY
 address ipv4 192.0.2.11
 key 7 CANARY7-0011223344BB
!
aaa group server tacacs+ TACACS-GRP
 server name ISE-PRIMARY
 server name ISE-SECONDARY
!
clock timezone UTC 0
!
vlan 10
 name DATA-ACCESS
vlan 20
 name VOICE
vlan 99
 name NATIVE-UNUSED
vlan 999
 name PARKING
!
vtp mode transparent
!
spanning-tree mode rapid-pvst
spanning-tree extend system-id
spanning-tree portfast edge bpduguard default
spanning-tree loopguard default
spanning-tree vlan 10,20 priority 4096
udld enable
!
ip dhcp snooping vlan 10,20
ip dhcp snooping
no ip dhcp snooping information option
ip dhcp snooping database flash:dhcp-snooping-db.dat
!
ip arp inspection vlan 10,20
ip arp inspection validate src-mac dst-mac ip
!
errdisable recovery cause bpduguard
errdisable recovery cause security-violation
errdisable recovery cause udld
errdisable recovery cause dhcp-rate-limit
errdisable recovery interval 300
!
ip device tracking policy IFC-POLICY
 limit address-count 4
 security-level glean
 tracking enable
!
switch 1 priority 15
switch 2 priority 14
switch stack-mac persistent timer 0
redundancy
 mode sso
!
boot system flash:cat9k_iosxe.17.09.04a.SPA.bin
!
interface Loopback0
 description management source and NTP/logging source
 ip address 198.51.100.1 255.255.255.255
!
interface Vlan1
 description unused default VLAN, administratively shut per hardening baseline
 no ip address
 shutdown
!
interface Vlan99
 description native VLAN, carries no hosts
 no ip address
 shutdown
!
interface Vlan10
 description DATA-ACCESS SVI
 ip address 192.0.2.1 255.255.255.0
 no ip proxy-arp
 no ip redirects
 no ip unreachables
 no ip directed-broadcast
 ip verify unicast source reachable-via rx
!
interface GigabitEthernet1/0/1
 description ACCESS-DATA-VOICE user port
 switchport mode access
 switchport access vlan 10
 switchport voice vlan 20
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 storm-control broadcast level 1.00
 storm-control multicast level 1.00
 ip dhcp snooping limit rate 15
 spanning-tree portfast edge
 spanning-tree bpduguard enable
 cdp enable
!
interface GigabitEthernet1/0/2
 description unused port, shut and parked per hardening baseline
 switchport mode access
 switchport access vlan 999
 shutdown
!
interface TenGigabitEthernet1/1/1
 description UPLINK-TO-CORE to CORE-01
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 spanning-tree guard root
 udld port aggressive
 no cdp enable
!
interface TenGigabitEthernet1/1/2
 description UPLINK-TO-CORE to CORE-02 (redundant)
 switchport mode trunk
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20
 switchport nonegotiate
 ip dhcp snooping trust
 ip arp inspection trust
 spanning-tree guard root
 udld port aggressive
 no cdp enable
!
ip access-list standard 90
 remark permits management VLAN only to HTTPS UI
 permit 192.0.2.0 0.0.0.255
 deny   any log
!
ip access-list standard VTY-MGMT
 remark jump host and NOC subnet only
 permit 192.0.2.128 0.0.0.31
 deny   any log
!
snmp-server group MON-GRP v3 priv
snmp-server host 192.0.2.20 version 3 priv monuser
snmp-server enable traps snmp linkup linkdown
snmp-server enable traps config
snmp-server enable traps aaa server
snmp ifmib ifindex persist
!
ntp authenticate
ntp authentication-key 1 sha1 CANARY-NTP-KEY-HARD-01
ntp trusted-key 1
ntp server 192.0.2.123 key 1
ntp server 198.51.100.123 key 1
ntp source Loopback0
!
logging host 192.0.2.30
logging host 192.0.2.31
logging trap informational
logging buffered 16384
logging source-interface Loopback0
logging console critical
archive
 log config
  logging enable
  hidekeys
!
ip ssh version 2
ip ssh dh min size 2048
ip ssh server algorithm encryption aes256-ctr aes128-ctr
ip ssh server algorithm mac hmac-sha2-256
ip ssh server algorithm kex diffie-hellman-group16-sha512
ip ssh authentication-retries 3
ip ssh time-out 60
!
banner login ^C
Authorized use only. This system is the property of Example Corp.
All activity is monitored, recorded, and subject to audit. Unauthorized
access is prohibited and violators will be prosecuted to the fullest
extent of the law. By continuing you consent to this monitoring.
^C
!
line con 0
 exec-timeout 10 0
 logging synchronous
line aux 0
 no exec
 transport input none
line vty 0 15
 access-class VTY-MGMT in
 exec-timeout 10 0
 login authentication default
 transport input ssh
 transport output ssh
 login block-for 60 attempts 3 within 60
!
login quiet-mode access-class VTY-MGMT
!
end
