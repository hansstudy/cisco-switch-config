!
! Repro fixture. Hand-authored for this project
! (Apache-2.0). Every physical line in this file is at column 0 -- zero indentation anywhere
! -- with at least one `exit` line and at least one mode-opening head (`interface`), which is
! the exact "flat authored input" shape the parser detects and switches to exit-driven
! nesting for. It must stay this way: adding even one indented line elsewhere in this file
! defeats the whole point and stops it exercising the flat-input path at all.
!
! IOS pops a global command back to global scope when it follows a mode block with no `exit`
! too, and even here WITH an explicit `exit` present, the following global command must still
! resolve to `mode_path = ()` -- not become a child of `interface Gi1/0/2`, and not stay gated
! out of `global`-mode constructs the way an unfixed exit-driven walker would.
!
hostname LAB-FLAT-NOEXIT-01
interface GigabitEthernet1/0/2
description flat, unindented interface body
exit
snmp-server host 192.0.2.20 version 2c CANARY-FLATINPUT-01
snmp-server community CANARY-FLATINPUT-COMMUNITY-01 RO 77
enable secret 9 CANARY-FLATINPUT-ENABLESEC-01
tacacs-server host 198.51.100.10 key 7 CANARY7-FLATINPUT-TACACS-01
end
