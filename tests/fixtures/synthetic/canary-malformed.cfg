!
! AC15 malformed-input fixture (AC15 assertion 5, AC15 assertion 10). Hand-authored for
! this project (Apache-2.0). Every secret-shaped value is from the frozen canary
! vocabulary; none of this is a real device configuration or a real paste capture.
!
! This fixture must never crash the parser and must never leak the canary values it
! carries, even though it is deliberately unparseable in several ways at once.
!
hostname LAB-MALFORMED-01
!
! -- (1) a pager artefact spliced into the middle of a canary-bearing line --------------
! Realistic capture: the terminal's --More-- prompt fired mid-word, and the backspaces
! that erase it survive in the pasted transcript. Pre-clean must repair this to
! `snmp-server community CANARY-COMMUNITY-MALFORMED-01 RO 77` and note only
! `pager artefact` + the line number -- never the text before or after repair.
snmp-server comm--More--unity CANARY-COMMUNITY-MALFORMED-01 RO 77
!
! -- (2) a username line in a form the parser cannot classify ---------------------------
! An unterminated quoted argument and stray shell-metacharacters: not a recognised
! `username` grammar shape. Must become a best-effort command node plus a
! CSC-SELF-0004 note naming only `unclassified line` -- never this text -- and parsing
! must continue past it rather than abort (exit 2 is reserved for empty/non-Cisco input).
username "carol&&$(reboot) secret CANARY-MALFORMED-UNCLASSIFIED-01
!
! -- (3) + (4): an unterminated banner whose body holds a canary, and swallows a
! truncated `crypto pki certificate chain` block that never reaches `quit` -----------------
! No closing `^C` appears anywhere below, so the block never
! closes: it runs to true EOF, every line below (including the certificate-chain-shaped
! text) becomes opaque banner body -- masked line-by-line against the full construct
! table and never structurally parsed -- and exactly one CSC-SELF-0005 note fires,
! naming only `unterminated banner block opened at line N`.
banner motd ^C
Unauthorized access is prohibited. Support key CANARY-MALFORMED-BANNER-01 is for lab use.
The block below never closes on purpose:
crypto pki certificate chain TP-MALFORMED
 certificate 03
  3082 CANARY-MALFORMED-CERTBODY-01AAAA BBBBCCCC
  DDDDEEEE CANARY-MALFORMED-CERTBODY-02BBBB
! no `quit` follows, and no closing ^C follows either -- both blocks are open at EOF
